[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyedookit"
version = "0.7.0"
description = "Async client for the Edookit parent portal (edookit.net)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TFoxik" }]
classifiers = [
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.12",
    "lxml>=6.1.0",
    "yarl>=1.24",
]

[project.urls]
Homepage = "https://github.com/TFoxik/pyedookit"
Repository = "https://github.com/TFoxik/pyedookit"
Issues = "https://github.com/TFoxik/pyedookit/issues"
Changelog = "https://github.com/TFoxik/pyedookit/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/pyedookit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "multidict>=6.9.1",
    "ruff>=0.17",
    "mypy>=2.4",
]
