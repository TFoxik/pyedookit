version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # aiohttp caps multidict below 7; let aiohttp decide when that moves.
      - dependency-name: multidict
        update-types: ["version-update:semver-major"]
